<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages — SOLE</title>
    <link rel="icon" type="image/svg+xml" href="../frontend/logo/logo.jpeg" />
    <link rel="alternate icon" href="../frontend/logo/logo.jpeg" />
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }

      /* ── LAYOUT MESSAGERIE ── */
      .msg-layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        height: calc(100vh - 70px);
        margin-top: 70px;
        overflow: hidden;
      }

      /* ── SIDEBAR CONVERSATIONS ── */
      .conv-sidebar {
        background: var(--dark);
        border-right: 1px solid var(--glass-bd);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .conv-sidebar-header {
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--glass-bd);
        flex-shrink: 0;
      }
      .conv-sidebar-title {
        font-family: var(--font-display);
        font-size: 1.6rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--white);
        margin-bottom: 14px;
      }
      .conv-search {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--dark2);
        border: 1px solid var(--glass-bd);
        border-radius: var(--r-pill);
        padding: 9px 16px;
      }
      .conv-search i {
        color: var(--txt3);
        font-size: 0.95rem;
      }
      .conv-search input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        font-family: var(--font-body);
        font-size: 0.86rem;
        color: var(--white);
      }
      .conv-search input::placeholder {
        color: var(--txt3);
      }

      .conv-list {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--glass-bd) transparent;
      }
      .conv-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        cursor: pointer;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        transition: background 0.15s;
        position: relative;
      }
      .conv-item:hover {
        background: var(--glass);
      }
      .conv-item.active {
        background: var(--red-pale);
        border-left: 3px solid var(--red);
      }
      .conv-avatar {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        flex-shrink: 0;
        background: var(--dark3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 1.1rem;
        color: var(--white);
        letter-spacing: 0.04em;
        position: relative;
        overflow: hidden;
      }
      .conv-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .conv-info {
        flex: 1;
        min-width: 0;
      }
      .conv-name {
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--white);
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conv-last-msg {
        font-size: 0.78rem;
        color: var(--txt3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conv-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
        flex-shrink: 0;
      }
      .conv-time {
        font-size: 0.7rem;
        color: var(--txt3);
      }
      .conv-unread {
        min-width: 18px;
        height: 18px;
        border-radius: 9px;
        background: var(--red);
        color: var(--white);
        font-size: 0.65rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
      }
      .conv-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 200px;
        color: var(--txt3);
        text-align: center;
        padding: 20px;
      }
      .conv-empty i {
        font-size: 2.5rem;
        margin-bottom: 12px;
      }
      .conv-empty p {
        font-size: 0.86rem;
        line-height: 1.5;
      }

      /* ── ZONE CHAT ── */
      .chat-zone {
        display: flex;
        flex-direction: column;
        background: var(--black);
        overflow: hidden;
        height: 100%;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        scrollbar-width: thin;
        scrollbar-color: var(--glass-bd) transparent;
      }
      .msg-group {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        max-width: 72%;
      }
      .msg-group.mine {
        margin-left: auto;
        flex-direction: row-reverse;
      }
      .msg-avatar {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        flex-shrink: 0;
        background: var(--dark3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--white);
        overflow: hidden;
      }
      .msg-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .msg-bubble {
        background: var(--dark2);
        border: 1px solid var(--glass-bd);
        border-radius: 18px 18px 18px 4px;
        padding: 11px 15px;
        font-size: 0.9rem;
        color: var(--txt);
        line-height: 1.5;
        max-width: 100%;
        word-break: break-word;
      }
      .msg-group.mine .msg-bubble {
        background: var(--red);
        border-color: var(--red);
        border-radius: 18px 18px 4px 18px;
        color: var(--white);
      }
      .msg-time {
        font-size: 0.68rem;
        color: var(--txt3);
        margin-top: 4px;
        text-align: right;
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 8px 14px;
        background: var(--dark2);
        border: 1px solid var(--glass-bd);
        border-radius: 18px;
        width: fit-content;
      }
      .typing-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--txt3);
        animation: typingBounce 1.2s ease-in-out infinite;
      }
      .typing-dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes typingBounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-5px);
        }
      }

      .chat-input-zone {
        border-top: 1px solid var(--glass-bd);
        padding: 16px 24px;
        background: var(--dark);
        flex-shrink: 0;
      }
      .chat-input-row {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--dark2);
        border: 1px solid var(--glass-bd2);
        border-radius: var(--r-pill);
        padding: 8px 8px 8px 20px;
        transition: border-color 0.18s;
      }
      .chat-input-row:focus-within {
        border-color: var(--red);
      }
      .chat-input-row input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        font-family: var(--font-body);
        font-size: 0.92rem;
        color: var(--white);
      }
      .chat-input-row input::placeholder {
        color: var(--txt3);
      }
      .btn-send {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--red);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--white);
        flex-shrink: 0;
        transition:
          background 0.18s,
          transform 0.18s;
      }
      .btn-send:hover {
        background: var(--red-light);
        transform: scale(1.05);
      }
      .btn-send:disabled {
        background: var(--dark3);
        cursor: not-allowed;
        transform: none;
      }

      .chat-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
      }
      .chat-empty i {
        font-size: 5rem;
        color: var(--dark3);
        margin-bottom: 20px;
      }
      .chat-empty h3 {
        font-family: var(--font-display);
        font-size: 2rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--txt3);
        margin-bottom: 10px;
      }
      .chat-empty p {
        color: var(--txt3);
        font-size: 0.88rem;
        font-weight: 300;
      }

      /* ── MOBILE ── */
      @media (max-width: 768px) {
        html,
        body {
          height: 100%;
          overflow: hidden;
        }

        .msg-layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
          height: calc(
            100dvh - 70px
          ); /* dvh = dynamic viewport height, gère le clavier virtuel */
        }
        .conv-sidebar {
          max-height: 240px;
          border-right: none;
          border-bottom: 1px solid var(--glass-bd);
        }
        .chat-zone {
          /* prend le reste de l'espace dispo naturellement dans la grid */
          min-height: 0;
        }
        .chat-messages {
          padding: 16px;
        }
        .chat-input-zone {
          padding: 12px 16px;
        }
        .msg-group {
          max-width: 88%;
        }
      }
    </style>
  </head>
  <body>
    <div class="grain"></div>
    <div class="toast" id="global-toast"></div>

    <nav class="navbar scrolled" id="navbar">
      <a href="/index.html" class="navbar-logo"
        ><span class="logo-dot"></span> SOLE</a
      >
      <ul class="navbar-links">
        <li><a href="/index.html">Accueil</a></li>
        <li><a href="/pages/boutiques.html">Boutiques</a></li>
        <li>
          <a href="/pages/messages.html" class="active"
            ><i class="ti ti-message-circle"></i> Messages</a
          >
        </li>
      </ul>
      <div class="navbar-actions" id="navbar-actions"></div>
      <button class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </button>
    </nav>
    <div class="mobile-menu" id="mobile-menu">
      <a href="/index.html"><i class="ti ti-home"></i> Accueil</a>
      <a href="/pages/boutiques.html"
        ><i class="ti ti-building-store"></i> Boutiques</a
      >
      <a href="/pages/messages.html"
        ><i class="ti ti-message-circle"></i> Messages</a
      >
    </div>

    <div class="msg-layout">
      <aside class="conv-sidebar">
        <div class="conv-sidebar-header">
          <div class="conv-sidebar-title">Messages</div>
          <div class="conv-search">
            <i class="ti ti-search"></i>
            <input
              type="text"
              id="search-conv"
              placeholder="Rechercher..."
              oninput="filtrerConversations()"
            />
          </div>
        </div>
        <div class="conv-list" id="conv-list">
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              height: 120px;
            "
          >
            <div class="spinner"></div>
          </div>
        </div>
      </aside>

      <div class="chat-zone" id="chat-zone">
        <div class="chat-empty" id="chat-empty">
          <i class="ti ti-message-circle-2"></i>
          <h3>Tes messages</h3>
          <p>
            Sélectionne une conversation<br />ou contacte une boutique pour
            démarrer.
          </p>
          <a
            href="/pages/boutiques.html"
            class="btn btn-red"
            style="margin-top: 24px"
          >
            <i class="ti ti-building-store"></i> Voir les boutiques
          </a>
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
      let socket = null;
      let convActuelle = null;
      let toutesConversations = [];
      let typingTimer = null;
      // ✅ Garde trace des IDs de messages envoyés par nous pour ignorer l'écho socket
      const messagesEnvoyesParMoi = new Set();

      // ── Init Socket.IO ────────────────────────────────
      function initSocket() {
        const user = Session.getUser();
        if (!user) return;

        const SOCKET_URL =
          window.location.hostname === "localhost"
            ? "http://localhost:5000"
            : "/";
        socket = io(SOCKET_URL, { transports: ["websocket"] });

        socket.on("connect", () => {
          socket.emit("user:join", user._id);
        });

        socket.on("message:receive", (message) => {
          // ✅ CORRECTION BUG 1 : ignorer l'écho de nos propres messages
          if (messagesEnvoyesParMoi.has(message._id)) {
            messagesEnvoyesParMoi.delete(message._id);
            return;
          }

          if (convActuelle && message.conversation === convActuelle) {
            appendMessage(message, false);
            scrollToBottom();
          }

          // ✅ CORRECTION BUG 1 : refresh sidebar SANS reconstruire la chat-zone
          rafraichirSidebar();
        });

        socket.on("typing:start", () => {
          const el = document.getElementById("typing-el");
          if (el) el.style.display = "flex";
        });

        socket.on("typing:stop", () => {
          const el = document.getElementById("typing-el");
          if (el) el.style.display = "none";
        });
      }

      // ── Charger les conversations (init seulement) ────
      async function chargerConversations() {
        try {
          const { data } = await Messages.conversations();
          toutesConversations = data;
          renderConversations(data);

          // ✅ CORRECTION BUG 1 : ouvrir depuis URL une seule fois au chargement initial
          const convParam = new URLSearchParams(window.location.search).get(
            "conv",
          );
          if (convParam && !convActuelle) {
            ouvrirConversation(convParam);
          }
        } catch {
          afficherToast("Erreur chargement conversations", "error");
        }
      }

      // ✅ NOUVEAU : refresh sidebar seul, sans toucher à la chat-zone
      async function rafraichirSidebar() {
        try {
          const { data } = await Messages.conversations();
          toutesConversations = data;
          // Garder le filtre de recherche actif si besoin
          const q =
            document.getElementById("search-conv")?.value?.toLowerCase() || "";
          if (q) {
            const filtrées = data.filter((c) => {
              const user = Session.getUser();
              return c.participants
                .filter((p) => p._id !== user?._id)
                .some((p) => p.nom.toLowerCase().includes(q));
            });
            renderConversations(filtrées);
          } else {
            renderConversations(data);
          }
        } catch {}
      }

      function filtrerConversations() {
        const q = document.getElementById("search-conv").value.toLowerCase();
        const user = Session.getUser();
        const filtrées = toutesConversations.filter((c) =>
          c.participants
            .filter((p) => p._id !== user?._id)
            .some((p) => p.nom.toLowerCase().includes(q)),
        );
        renderConversations(filtrées);
      }

      function renderConversations(convs) {
        const el = document.getElementById("conv-list");
        const user = Session.getUser();
        if (!convs.length) {
          el.innerHTML = `<div class="conv-empty"><i class="ti ti-message-off"></i><p>Aucune conversation.<br>Contacte une boutique pour démarrer.</p></div>`;
          return;
        }
        el.innerHTML = convs
          .map((c) => {
            const autre =
              c.participants.find((p) => p._id !== user._id) ||
              c.participants[0];
            const nonLus = c.nonLus?.get
              ? c.nonLus.get(user._id)
              : c.nonLus?.[user._id] || 0;
            const lastMsg =
              c.dernierMessage?.contenu || "Démarrer la conversation...";
            const lastTime = c.dernierMessageAt
              ? formatDate(c.dernierMessageAt)
              : "";
            const initiale = (autre?.nom || "?")[0].toUpperCase();
            const isActive = c._id === convActuelle;

            return `
          <div class="conv-item ${isActive ? "active" : ""}" onclick="ouvrirConversation('${c._id}')" data-conv-id="${c._id}">
            <div class="conv-avatar">
              ${autre?.avatar ? `<img src="${autre.avatar}" alt="${autre.nom}">` : initiale}
            </div>
            <div class="conv-info">
              <div class="conv-name">${autre?.nom || "Utilisateur"}</div>
              <div class="conv-last-msg">${lastMsg.substring(0, 45)}${lastMsg.length > 45 ? "..." : ""}</div>
            </div>
            <div class="conv-meta">
              <span class="conv-time">${lastTime}</span>
              ${nonLus > 0 ? `<span class="conv-unread">${nonLus > 9 ? "9+" : nonLus}</span>` : ""}
            </div>
          </div>`;
          })
          .join("");
      }

      // ── Ouvrir une conversation ───────────────────────
      async function ouvrirConversation(convId) {
        // ✅ CORRECTION BUG 1 : si on clique sur la même conv déjà ouverte, ne rien faire
        if (convId === convActuelle) return;
        convActuelle = convId;

        document.querySelectorAll(".conv-item").forEach((el) => {
          el.classList.toggle("active", el.dataset.convId === convId);
        });

        if (socket) socket.emit("conversation:join", convId);

        try {
          const { data: msgs } = await Messages.getMessages(convId);
          const conv = toutesConversations.find((c) => c._id === convId);
          const user = Session.getUser();
          const autre =
            conv?.participants.find((p) => p._id !== user._id) ||
            conv?.participants[0];

          const chatZone = document.getElementById("chat-zone");
          chatZone.innerHTML = `
          <div class="chat-messages" id="chat-messages">
            ${
              msgs.length
                ? msgs
                    .map((m) =>
                      renderMessage(
                        m,
                        m.expediteur._id === user._id ||
                          m.expediteur === user._id,
                      ),
                    )
                    .join("")
                : `<div style="text-align:center;padding:40px;color:var(--txt3);">
                  <i class="ti ti-message-circle" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
                  Début de la conversation
                 </div>`
            }
            <div id="typing-el" style="display:none;">
              <div class="msg-group">
                <div class="msg-avatar">${(autre?.nom || "?")[0].toUpperCase()}</div>
                <div class="typing-indicator">
                  <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="chat-input-zone">
            <div class="chat-input-row">
              <input type="text" id="msg-input" placeholder="Écris un message..."
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();envoyerMessage();}"
                oninput="onTyping()" />
              <button class="btn-send" id="btn-send" onclick="envoyerMessage()">
                <i class="ti ti-send"></i>
              </button>
            </div>
          </div>`;

          scrollToBottom();
          document.getElementById("msg-input").focus();

          // ✅ Refresh sidebar (non-lus mis à zéro) SANS reconstruire la chat-zone
          rafraichirSidebar();
        } catch (err) {
          afficherToast(err.message, "error");
        }
      }

      function renderMessage(msg, isMine) {
        const nom = msg.expediteur?.nom || "";
        const init = nom[0]?.toUpperCase() || "?";
        const avatar = msg.expediteur?.avatar;
        return `
        <div class="msg-group ${isMine ? "mine" : ""}">
          ${!isMine ? `<div class="msg-avatar">${avatar ? `<img src="${avatar}" alt="${nom}">` : init}</div>` : ""}
          <div>
            <div class="msg-bubble">${msg.contenu}</div>
            <div class="msg-time">${formatDate(msg.createdAt)}</div>
          </div>
        </div>`;
      }

      function appendMessage(msg, isMine) {
        const container = document.getElementById("chat-messages");
        if (!container) return;
        const el = document.createElement("div");
        el.innerHTML = renderMessage(msg, isMine);
        const typingEl = document.getElementById("typing-el");
        if (typingEl) {
          container.insertBefore(el.firstElementChild, typingEl);
        } else {
          container.appendChild(el.firstElementChild);
        }
      }

      // ── Envoyer un message ────────────────────────────
      async function envoyerMessage() {
        if (!convActuelle) return;
        const input = document.getElementById("msg-input");
        if (!input) return;
        const contenu = input.value.trim();
        if (!contenu) return;

        // ✅ CORRECTION BUG 1 : vider l'input APRES lecture, pas avant
        const btn = document.getElementById("btn-send");
        if (btn) btn.disabled = true;
        input.value = ""; // On vide l'input maintenant que le contenu est capturé

        try {
          const { data: msg } = await Messages.envoyerMessage(convActuelle, {
            contenu,
          });

          // ✅ Marquer l'ID de ce message pour ignorer l'écho socket
          if (msg._id) messagesEnvoyesParMoi.add(msg._id);

          appendMessage(msg, true);
          scrollToBottom();

          if (socket) {
            socket.emit("message:send", {
              conversationId: convActuelle,
              message: msg,
            });
            socket.emit("typing:stop", { conversationId: convActuelle });
          }

          // ✅ Refresh UNIQUEMENT la sidebar, pas toute la page
          rafraichirSidebar();
        } catch (err) {
          // ✅ En cas d'erreur, remettre le contenu dans l'input pour ne pas le perdre
          input.value = contenu;
          afficherToast(err.message, "error");
        } finally {
          if (btn) btn.disabled = false;
          input.focus();
        }
      }

      function onTyping() {
        if (!socket || !convActuelle) return;
        const user = Session.getUser();
        socket.emit("typing:start", {
          conversationId: convActuelle,
          userId: user._id,
          nom: user.nom,
        });
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
          socket.emit("typing:stop", { conversationId: convActuelle });
        }, 2000);
      }

      function scrollToBottom() {
        const el = document.getElementById("chat-messages");
        if (el) el.scrollTop = el.scrollHeight;
      }

      document.addEventListener("DOMContentLoaded", () => {
        if (!protegerPage()) return;
        initSocket();
        chargerConversations();
        majNavbar();
      });
    </script>
  </body>
</html>
